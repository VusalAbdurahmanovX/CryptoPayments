services:
  api:
    build: .
    image: cryptopayments-go:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - payments:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  payments:
