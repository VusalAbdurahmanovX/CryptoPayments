# Isolated, valueless local EVM. NEVER fund an Anvil account on a real network.
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "97", "--block-time", "1", "--silent", "--state", "/state/chain.json"]
    ports:
      - "127.0.0.1:18545:8545"
    volumes:
      - local-chain:/state
    restart: unless-stopped
  api:
    environment:
      RPC_URL: http://anvil:8545
      CONFIRMATIONS: "3"
      POLL_SECONDS: "1"
    depends_on:
      - anvil
volumes:
  local-chain:
